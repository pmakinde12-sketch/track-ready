<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PTS scenes · Track Ready</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#9fb8c9;color:#f4f1ea;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #game{position:fixed;inset:0}
  .hide{display:none!important}
  #top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:900;font-size:14px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));z-index:5;pointer-events:none}
  #stage{letter-spacing:.5px}
  #score{color:#ffb020}
  #banner{position:fixed;top:44px;left:12px;right:12px;text-align:center;font-weight:900;font-size:17px;z-index:5;pointer-events:none;text-shadow:0 2px 8px #000}
  #timerBar{position:fixed;top:100px;left:20%;right:20%;height:8px;background:rgba(0,0,0,.4);border-radius:6px;z-index:5;overflow:hidden}
  #timerFill{height:100%;background:#ff4d4d;width:100%}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:16px 16px 20px;background:rgba(14,16,20,.94);border-radius:20px 20px 0 0;max-height:62vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
  #sheet h2{font-size:13px;letter-spacing:1.5px;color:#ffb020;margin-bottom:6px}
  #sheet .q{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:12px}
  #sheet .body{font-size:14.5px;line-height:1.55;opacity:.9;margin-bottom:12px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{font:inherit;font-weight:700;font-size:15.5px;text-align:left;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:12px 14px;cursor:pointer}
  .opt.sel{border-color:#ffb020;background:rgba(255,176,32,.15)}
  .opt.good{border-color:#57d27a;background:rgba(87,210,122,.18)}
  .opt.bad{border-color:#ff5a5a;background:rgba(255,90,90,.15)}
  .go{font:inherit;font-weight:900;font-size:17px;border:0;border-radius:12px;padding:14px;width:100%;background:#ff7a00;color:#111;margin-top:12px;cursor:pointer;box-shadow:0 4px 0 #a84f00}
  .fb{border-radius:12px;padding:12px 14px;margin-top:10px;font-size:14.5px;line-height:1.5}
  .fb.ok{background:rgba(87,210,122,.15);border:1px solid rgba(87,210,122,.5)}
  .fb.no{background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.5)}
  .fb>b:first-child{display:block;font-size:16px;margin-bottom:3px}
  .ref{font-size:12px;opacity:.6;margin-top:6px}
  #pop{position:fixed;top:40%;left:0;right:0;text-align:center;font-size:40px;font-weight:900;z-index:7;pointer-events:none;opacity:0;text-shadow:0 4px 20px rgba(0,0,0,.7)}
  #pop.on{animation:pp 1.2s ease-out}
  @keyframes pp{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
  #flash{position:fixed;inset:0;background:#ff2020;opacity:0;z-index:4;pointer-events:none}
  #flash.on{animation:fl .9s ease-out}
  @keyframes fl{0%{opacity:.45}100%{opacity:0}}
  .tag{display:inline-block;background:#ff7a00;color:#111;font-weight:900;border-radius:6px;padding:2px 7px;font-size:12px;margin-right:6px}
  .disc{font-size:12px;opacity:.6;margin-top:10px;line-height:1.4}
  #sheet.compact{max-height:34vh}
  #sheet.compact .q{font-size:16px;margin-bottom:8px}
  .hint{font-size:12.5px;opacity:.65;margin:-4px 0 10px}
  .zbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .zb{font:inherit;font-weight:900;font-size:15px;border:2px solid rgba(255,176,32,.7);background:rgba(255,176,32,.12);color:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}
  .zb.good{border-color:#57d27a;background:rgba(87,210,122,.25)} .zb.bad{border-color:#ff5a5a;background:rgba(255,90,90,.2)}
  .chat{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px}
  .chat .m{background:#243042;border-radius:12px 12px 12px 4px;padding:8px 11px;font-size:14.5px;max-width:88%;line-height:1.4}
  .chat .m.me{align-self:flex-end;background:#5a3a10;border-radius:12px 12px 4px 12px}
  .chat i{display:block;font-style:normal;font-size:11px;font-weight:900;opacity:.6;letter-spacing:.5px}
  #card{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none}
  .idc{background:#f4f6f8;color:#111;border-radius:14px;padding:14px 16px;width:230px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .idc b{display:block;color:#0b4a9e;letter-spacing:2px}.idc span{font-size:13px;font-weight:700}
  .idc .exp{margin-top:10px;color:#d02020;font-weight:900;font-size:20px;border:3px solid #d02020;border-radius:8px;display:inline-block;padding:2px 8px;transform:rotate(-6deg);line-height:1.1}
  .form{background:#fffdf4;color:#111;border-radius:6px;padding:14px 16px;width:230px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:13px}
  .form b{display:block;font-size:20px}.form i{display:block;margin-top:14px;font-style:normal;opacity:.7}
  .ring{background:rgba(14,16,20,.92);border:2px solid #57d27a;border-radius:16px;padding:10px 16px;font-size:26px;display:flex;align-items:center;gap:10px;animation:rg .5s ease-in-out infinite alternate;white-space:nowrap}
  .ring b{font-size:15px}.ring small{display:block;font-size:12px;opacity:.7}
  @keyframes rg{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
  #lookBtn{position:fixed;right:16px;bottom:calc(34vh + 14px);z-index:7;font:inherit;font-weight:900;font-size:18px;border:0;border-radius:50px;padding:18px 22px;background:#ffb020;color:#111;box-shadow:0 5px 0 #a86a00;cursor:pointer}
  #lookMeter{position:fixed;left:16px;right:170px;bottom:calc(34vh + 34px);height:12px;background:rgba(0,0,0,.45);border-radius:8px;z-index:7;overflow:hidden}
  #lookFill{height:100%;width:0%}
  #dim{position:fixed;inset:0;background:linear-gradient(#000 0%,#000 45%,rgba(0,0,0,0) 75%);opacity:0;z-index:3;pointer-events:none;transition:opacity .15s}
  ul.miss{margin:6px 0 0 18px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div id="game"></div>
<div id="top"><div id="stage">PTS</div><div id="score">✓ 0</div></div>
<div id="banner"></div>
<div id="timerBar" class="hide"><div id="timerFill"></div></div>
<div id="sheet"></div>
<div id="pop"></div>
<div id="flash"></div>
<div id="card" class="hide"></div>
<div id="dim"></div>
<button id="lookBtn" class="hide">👀 LOOK UP</button><div id="lookMeter" class="hide"><div id="lookFill"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){$('sheet').innerHTML='<div class="q">Couldn\'t load the 3D engine. Check your connection and refresh.</div>';return}

// ---------- audio ----------
let ac=null;
function tone(f,d,type='sine',v=.07,delay=0,f2){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const S={
  lookoutHorn(){for(let i=0;i<3;i++){tone(520,.45,'square',.06,i*.6);tone(660,.45,'square',.04,i*.6)}},
  trainHorn(){tone(311,.9,'sawtooth',.06);tone(392,.9,'sawtooth',.05);tone(311,.9,'sawtooth',.06,1.0);tone(370,.9,'sawtooth',.05,1.0)},
  rumble(){tone(55,2.4,'sawtooth',.06,0,40)},
  good(){tone(660,.12,'triangle',.08);tone(990,.2,'triangle',.08,.1)},
  bad(){tone(180,.4,'square',.06,0,90)},
  tick(){tone(1200,.05,'square',.03)},
  clank(){tone(900,.06,'square',.03,0,600)}
};

// ---------- renderer ----------
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
$('game').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa9c3d6);
scene.fog=new THREE.Fog(0xa9c3d6,60,260);
const camera=new THREE.PerspectiveCamera(55,1,.1,600);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth/innerHeight<.75?70:55;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xffffff,0x6b6a55,1.05));
const sun=new THREE.DirectionalLight(0xfff2dc,.75);sun.position.set(-30,50,40);scene.add(sun);

function ctex(w,h,fn,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t}
const gc={};const bx=(w,h,d)=>gc[w+'_'+h+'_'+d]||(gc[w+'_'+h+'_'+d]=new THREE.BoxGeometry(w,h,d));
const mc={};const lm=c=>mc[c]||(mc[c]=new THREE.MeshLambertMaterial({color:c}));
const basic=c=>new THREE.MeshBasicMaterial({color:c});
function label(txt,bg='#111',fg='#fff',w=3.2){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.fillStyle=bg;x.beginPath();x.roundRect?x.roundRect(4,4,504,120,28):x.rect(4,4,504,120);x.fill();x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';let f=60;x.font=`900 ${f}px system-ui,sans-serif`;while(x.measureText(txt).width>470){f-=3;x.font=`900 ${f}px system-ui,sans-serif`}x.fillText(txt,256,68);const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));s.scale.set(w,w/4,1);s.renderOrder=10;return s}

// ---------- world (1 unit = 1 metre; track runs along X) ----------
const UP_Z=0, DN_Z=-3.4, GAUGE=1.435, RAIL_Z=GAUGE/2;
const LEN=700;
const grass=ctex(128,128,(x,w,h)=>{x.fillStyle='#6f8a4a';x.fillRect(0,0,w,h);for(let i=0;i<1500;i++){x.fillStyle=Math.random()<.5?'#5f7a3d':'#86a05a';x.fillRect(Math.random()*w,Math.random()*h,2,3)}},120,40);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(LEN,160).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:grass}));gr.position.y=-.02;scene.add(gr);
const ballastT=ctex(128,64,(x,w,h)=>{x.fillStyle='#8c8780';x.fillRect(0,0,w,h);for(let i=0;i<1400;i++){const c=110+Math.random()*80|0;x.fillStyle=`rgb(${c},${c-4},${c-10})`;x.fillRect(Math.random()*w,Math.random()*h,3,2)}},LEN/2,2);
for(const z of [UP_Z,DN_Z]){
  const bal=new THREE.Mesh(new THREE.BoxGeometry(LEN,.32,3.4),[lm(0x77736c),lm(0x77736c),new THREE.MeshLambertMaterial({map:ballastT}),lm(0x77736c),lm(0x77736c),lm(0x77736c)]);bal.position.set(0,.14,z);scene.add(bal);
  const n=Math.floor(LEN/.65);const sl=new THREE.InstancedMesh(bx(.26,.14,2.6),lm(0x5a5a58),n);const d=new THREE.Object3D();
  for(let i=0;i<n;i++){d.position.set(-LEN/2+i*.65,.33,z);d.updateMatrix();sl.setMatrixAt(i,d.matrix)}scene.add(sl);
  for(const s of [-1,1]){const r=new THREE.Mesh(bx(LEN,.16,.08),lm(0x8d8a85));r.position.set(0,.47,z+s*RAIL_Z);scene.add(r);const top=new THREE.Mesh(bx(LEN,.02,.07),basic(0xd8d6d2));top.position.set(0,.56,z+s*RAIL_Z);scene.add(top)}
}
// cess path (near side) and far cess
const cessT=ctex(64,64,(x,w,h)=>{x.fillStyle='#a08c6a';x.fillRect(0,0,w,h);for(let i=0;i<400;i++){x.fillStyle=Math.random()<.5?'#8c7a5a':'#b39f7c';x.fillRect(Math.random()*w,Math.random()*h,2,2)}},LEN/2,1);
const cess=new THREE.Mesh(new THREE.PlaneGeometry(LEN,2.4).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:cessT}));cess.position.set(0,.03,3.0);scene.add(cess);
// fence
for(let x=-LEN/2;x<LEN/2;x+=3){const p=new THREE.Mesh(bx(.08,1.4,.08),lm(0x3a3d40));p.position.set(x,.7,4.9);scene.add(p)}
for(const y of [.5,.9,1.3]){const w=new THREE.Mesh(bx(LEN,.03,.03),lm(0x555a60));w.position.set(0,y,4.9);scene.add(w)}
for(const s of [1,-1])for(let x=-LEN/2;x<LEN/2;x+=7+Math.random()*9){if(s>0&&Math.abs(x)<40)continue;const z=s>0?8+Math.random()*12:-9-Math.random()*14;const t=new THREE.Mesh(bx(.3,2.2,.3),lm(0x5a3a22));t.position.set(x,1.1,z);scene.add(t);const f=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6+Math.random(),0),lm([0x3f6a35,0x4c7a3c,0x35602e][Math.floor(Math.random()*3)]));f.position.set(x,3.3,z);scene.add(f)}
// signal
{const p=new THREE.Mesh(bx(.18,4.2,.18),lm(0x222222));p.position.set(-38,2.1,2.0);scene.add(p);const h=new THREE.Mesh(bx(.5,1.2,.4),lm(0x111111));h.position.set(-38,4.3,2.0);scene.add(h);const l=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),basic(0x57f287));l.position.set(-38,4.6,2.2);scene.add(l)}

// ---------- people ----------
function makePerson(vest,pants,skin,helmet){
  const g=new THREE.Group();const legs=[],arms=[];
  const body=new THREE.Group();g.add(body);
  for(const s of [-1,1]){const p=new THREE.Group();p.position.set(.11*s,.82,0);const m=new THREE.Mesh(bx(.17,.82,.19),lm(pants));m.position.y=-.41;p.add(m);const b=new THREE.Mesh(bx(.2,.13,.3),lm(0x1a1a1a));b.position.set(0,-.78,-.04);p.add(b);body.add(p);legs.push(p)}
  const torso=new THREE.Mesh(bx(.48,.62,.28),lm(vest));torso.position.y=1.13;body.add(torso);
  if(vest===0xff7a00||vest===0xf5e042){for(const y of [1.0,1.22]){const st=new THREE.Mesh(bx(.49,.05,.29),basic(0xe8e8e8));st.position.y=y;body.add(st)}}
  for(const s of [-1,1]){const p=new THREE.Group();p.position.set(.31*s,1.4,0);const m=new THREE.Mesh(bx(.14,.58,.15),lm(vest));m.position.y=-.27;p.add(m);const hd=new THREE.Mesh(bx(.12,.12,.12),lm(skin));hd.position.y=-.6;p.add(hd);body.add(p);arms.push(p)}
  const head=new THREE.Mesh(bx(.3,.32,.3),lm(skin));head.position.y=1.62;body.add(head);
  if(helmet){const h=new THREE.Mesh(bx(.36,.16,.38),lm(helmet));h.position.y=1.84;body.add(h);const br=new THREE.Mesh(bx(.36,.03,.12),lm(helmet));br.position.set(0,1.77,-.22);body.add(br)}
  const sh=new THREE.Mesh(new THREE.CircleGeometry(.4,16).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.25,depthWrite:false}));sh.position.y=.05;g.add(sh);
  g.userData={legs,arms,body,head,walk:0,pose:'stand'};
  return g;
}
const people=[];
function addPerson(p,x,z,face){p.position.set(x,.32,z);p.rotation.y=face||0;scene.add(p);people.push(p);return p}
// player: orange vest, white helmet (marked with a ring)
const player=addPerson(makePerson(0xff7a00,0x1f2a44,0x7a4a2c,0xffffff),0,UP_Z,0);
const ring=new THREE.Mesh(new THREE.RingGeometry(.5,.62,24).rotateX(-Math.PI/2),basic(0xffb020));ring.position.y=.06;player.add(ring);
const youTag=label('YOU','#ffb020','#111',1.2);youTag.position.set(0,2.4,0);player.add(youTag);
const coss=addPerson(makePerson(0xff7a00,0x1f2a44,0xf1c9a5,0x2b5fd6),-5,3.0,Math.PI/2);
const cossTag=label('COSS','#2b5fd6','#fff',1.3);cossTag.position.set(0,2.4,0);coss.add(cossTag);
const lookout=addPerson(makePerson(0xff7a00,0x1f2a44,0xa86b45,0xffffff),46,3.2,-Math.PI/2);
const loTag=label('LOOKOUT','#111','#ffb020',1.6);loTag.position.set(0,2.4,0);lookout.add(loTag);
const flag=new THREE.Mesh(bx(.02,.35,.45),basic(0xf5e042));flag.position.set(0,-.6,-.25);lookout.userData.arms[1].add(flag);
const mate=addPerson(makePerson(0xff7a00,0x2a2a2a,0xd9a27a,0xffffff),2.4,UP_Z,0);
armband(coss,0x2b5fd6);armband(lookout,0xffffff,0xd23b3b);

// ---------- trains ----------
function makeTrain(col,stripe){
  const g=new THREE.Group();
  const side=ctex(1024,256,(x,w,h)=>{
    x.fillStyle=col;x.fillRect(0,0,w,h);x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,0,w,18);
    x.fillStyle=stripe;x.fillRect(0,200,w,18);
    for(let i=0;i<7;i++){const wx=40+i*140;
      if(i===3){x.fillStyle='#e0b400';x.fillRect(wx-4,56,108,176);x.fillStyle='#1b1d22';x.fillRect(wx+8,70,38,80);x.fillRect(wx+58,70,38,80);x.fillStyle='#111';x.fillRect(wx+50,56,4,176);continue}
      x.fillStyle='#1b1d22';if(x.roundRect){x.beginPath();x.roundRect(wx,64,104,70,12);x.fill()}else x.fillRect(wx,64,104,70);
      x.fillStyle='rgba(255,255,255,.14)';x.fillRect(wx+8,70,44,18)}
  });
  const sideMat=new THREE.MeshLambertMaterial({map:side}),bodyMat=new THREE.MeshLambertMaterial({color:new THREE.Color(col)}),roofMat=lm(0x8b9097),under=lm(0x2a2a2a),dark=lm(0x1e1f22);
  const roofGeo=new THREE.CylinderGeometry(1.4,1.4,19.9,18).rotateZ(Math.PI/2).scale(1,.3,1);
  const wheelGeo=new THREE.CylinderGeometry(.42,.42,.12,14).rotateX(Math.PI/2);
  for(let i=0;i<3;i++){
    const cx=i*20.5+10.2;
    const body=new THREE.Mesh(bx(20,2.7,2.8),[bodyMat,bodyMat,roofMat,under,sideMat,sideMat]);body.position.set(cx,2.35,0);g.add(body);
    const roof=new THREE.Mesh(roofGeo,roofMat);roof.position.set(cx,3.7,0);g.add(roof);
    const skirt=new THREE.Mesh(bx(19.6,.5,2.5),dark);skirt.position.set(cx,.85,0);g.add(skirt);
    for(const bxp of [-7,7]){const bg=new THREE.Mesh(bx(2.8,.55,2.2),under);bg.position.set(cx+bxp,.78,0);g.add(bg);for(const wz of [-.72,.72])for(const wx of [-.85,.85]){const w=new THREE.Mesh(wheelGeo,lm(0x3a3a3a));w.position.set(cx+bxp+wx,.6,wz);g.add(w)}}
    if(i<2){const gw=new THREE.Mesh(bx(.6,2.4,1.6),dark);gw.position.set(cx+10.25,2.3,0);g.add(gw)}
  }
  // cab front
  const nose=new THREE.Mesh(bx(1.0,2.3,2.78),lm(0xf5d000));nose.position.set(-.3,2.05,0);g.add(nose);
  const cabTop=new THREE.Mesh(bx(.8,1.15,2.6),bodyMat);cabTop.position.set(-.1,3.25,0);cabTop.rotation.z=-.22;g.add(cabTop);
  const ws=new THREE.Mesh(bx(.06,.85,2.3),lm(0x14171c));ws.position.set(-.52,3.18,0);ws.rotation.z=-.22;g.add(ws);
  for(const s of [-.85,.85]){const hl=new THREE.Mesh(bx(.08,.22,.42),basic(0xfff4c8));hl.position.set(-.82,1.55,s);g.add(hl);const gl=new THREE.Sprite(new THREE.SpriteMaterial({color:0xfff2c0,transparent:true,opacity:.35,depthWrite:false,blending:THREE.AdditiveBlending}));gl.scale.set(.45,.45,1);gl.position.set(-.95,1.55,s);g.add(gl)}
  const coup=new THREE.Mesh(bx(.6,.3,.4),dark);coup.position.set(-.9,1.0,0);g.add(coup);
  g.visible=false;scene.add(g);return g;
}
const upTrain=makeTrain('#e4e7ec','#2b5fd6'),dnTrain=makeTrain('#c64a3a','#f4f1ea');
upTrain.position.z=UP_Z;dnTrain.position.z=DN_Z;dnTrain.rotation.y=Math.PI;
// ---------- lineside detail ----------
{

const tweens=[];
function tween(dur,fn){return new Promise(res=>tweens.push({t:0,dur,fn,res}))}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const camP=new THREE.Vector3(14,7,16),camL=new THREE.Vector3(0,1,-1);
function camTo(p,l,dur=1.4){const p0=camP.clone(),l0=camL.clone();return tween(dur,k=>{const e=ease(k);camP.lerpVectors(p0,p,e);camL.lerpVectors(l0,l,e)})}
function walkTo(pp,x,z,speed=2.4){const sx=pp.position.x,sz=pp.position.z;const dist=Math.hypot(x-sx,z-sz);if(dist<.01)return Promise.resolve();pp.rotation.y=Math.atan2(-(x-sx),-(z-sz));pp.userData.pose='walk';return tween(dist/speed,k=>{pp.position.x=sx+(x-sx)*k;pp.position.z=sz+(z-sz)*k}).then(()=>{pp.userData.pose='stand'})}
function runTrain(tr,from,to,speed){tr.visible=true;tr.position.x=from;return tween(Math.abs(to-from)/speed,k=>{tr.position.x=from+(to-from)*k}).then(()=>{tr.visible=false})}

function multi(title,q,items,goodSet,fb,ref){

    const btns=[...$('sheet').querySelectorAll('.opt')];
    btns.forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel');S.tick()});
    $('done').onclick=()=>{

      let right=0;items.forEach((_,i)=>{const want=goodSet.includes(i),got=sel.has(i);b2=btns[i];if(want)b2.classList.add('good');else if(got)b2.classList.add('bad');if(want===got)right++});
      const ok=right===items.length;addScore(right*2);ok?S.good():S.bad();
      $('fbx').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'✅ Spot on':`❌ ${right}/${items.length} right`}</b>${fb}${ref?`<div class="ref">${ref}</div>`:''}</div><button class="go">Next</button>`;

{id:'L2',r:['L2'],sec:'L',t:'Getting on to the railway',ref:'HB1 §3',
 set(W){W.P.gate(4.6,false);W.P.sign(8.2,5.1,['ACCESS','POINT'],{face:0,y:1.3,w:1,h:.6,bg:'#0b4a9e',fg:'#fff'});W.P.gap(-1.5);W.me(2.4,8.5,0);W.cam([2.4,5.5,21],[2.4,.8,5])},
 q:{t:'tap',p:'You\'ve parked up. Tap how you\'ll get on to the railway.',z:[{id:'gate',x:6.2,z:6,l:'A'},{id:'gap',x:-1.5,z:6.3,l:'B'}],a:'gate'},
 why:'Use <b>authorised access points</b> and walking routes only. Never use gaps in the fence.'},
{id:'L3',r:['L3'],sec:'L',t:'Driver sounds the horn',ref:'HB1 §3',
 set(W){W.speed(60);W.me(0,3.1,-Math.PI/2);W.cam([-7,3,9],[6,1.8,1])},
 async play(W){upTrain.visible=true;upTrain.position.x=170;S.trainHorn();await tween(2.5,k=>upTrain.position.x=170-100*k)},
 q:{t:'pick',p:'You\'re in your position of safety. The driver sounds the horn at you. How do you acknowledge?',o:['Raise one arm above your head','Raise both arms above your head','Thumbs up','Do nothing, stay still'],a:0},
 async after(W,ok){W.pose(player,'one');await runTrain(upTrain,70,-212,32);W.pose(player,null)},
 why:'Acknowledge by raising <b>one arm</b> above your head. Both arms above your head is the emergency signal to <b>stop</b>.'},
{id:'L4',r:['L4'],sec:'L',t:'Where does the spoil go?',ref:'HB1 §3',
 set(W){W.me(1,4.4,Math.PI);W.P.spoil(-3,4.2);W.P.measure(3,R1,R1+2,'2 m');W.cam([-5,3.6,9.5],[1,.6,3])},
 q:{t:'pick',p:'You\'re digging lineside. You want to put the spoil heap 2 m from the rail. No COSS on site.',o:['Only if a COSS is there and agrees','Fine, it\'s still lineside work','Fine at night when there are fewer trains','Fine if you look out for trains yourself'],a:0},
 why:'Lineside work must not affect the on-or-near-the-line area (within 3 m) unless a <b>COSS is there and agrees</b>.'},
{id:'L5',r:['L5'],sec:'L',t:'Van on the access road',ref:'HB1 §3',
 set(W){W.P.van(-2,7);W.P.gate(1,true);W.me(5,6.3,Math.PI/2);W.cam([4,4,15],[1,1,4])},
 q:{t:'pick',p:'The van driver (PTS only) wants to drive along the cess to drop materials, within 3 m of the line. No COSS here.',o:['Not allowed: he\'d need to be a COSS or IWA, or a COSS has to agree','Fine if he goes slowly','Fine with hazard lights on','Fine in daylight'],a:0},
 why:'Road vehicles stay off on-or-near-the-line unless the driver is a <b>COSS/IWA</b> or a <b>COSS agrees</b>.'},
// ---------- GOING ON ALONE ----------
{id:'A1',r:['A1'],sec:'A',t:'Walking on your own',ref:'HB1 §4',
 set(W){W.me(-4,3.0)},
 q:{t:'pick',p:'You\'re PTS only. When can you go on or near the line by yourself?',o:['When a COSS has told you to walk to or from a site on your own','Any time you\'ve got a valid PTS','When the line speed is under 50 mph','When it\'s daylight'],a:0},
 why:'You can only go on or near the line alone if you\'re a <b>COSS or IWA</b>, or a <b>COSS has told you</b> to walk to (or from) a site.'},
{id:'A2',r:['A2'],sec:'A',t:'At the access point',ref:'HB1 §4',
 set(W){W.me(3,6.2,0);W.P.gate(1,false);W.card(`<div class="idc"><b>SENTINEL</b><span>Personal Track Safety</span><div class="exp">EXPIRED<br><small>last month</small></div></div>`);W.cam([3,3,12],[2,1.5,4.5])},
 q:{t:'pick',p:'At the gate, you notice your PTS ran out last month.',o:['Don\'t go on: you need a valid PTS','Go on, it\'s only a month','Go on if nobody checks','Go on and renew it tomorrow'],a:0},
 why:'You must hold a <b>valid PTS</b> certificate to go on or near the line.'},
{id:'A3',r:['A3'],sec:'A',t:'Last few clips',ref:'HB1 §4',
 set(W){W.me(2,0,-Math.PI/2);player.userData.pose='kneel';for(let i=0;i<3;i++)W.P.box(4+i*.65,.45,.7,.2,.12,.2,0x333333)},
 async play(W){W.say(player,'Gang\'s gone… I\'ll just finish these',2600);await W.wait(2400);player.userData.pose='stand'},
 q:{t:'pick',p:'The gang\'s left. You\'re PTS only and want to finish the last few clips on your own.',o:['Stop and get off: you can\'t work alone unless you\'re a COSS or IWA','Carry on, you know the job','Carry on if you keep looking up','Carry on if you tell the signaller'],a:0},
 why:'<b>Never work alone</b> on or near the line unless you\'re a COSS or IWA.'},
{id:'A4',r:['A4'],sec:'A',t:'Night walk',ref:'HB1 §4',
 set(W){W.night(true);W.me(-2,3.0);W.cam([-7,3,8],[3,1,1])},
 q:{t:'pick',p:'It\'s dark and you\'re about to walk to site. What must you carry?',o:['A lamp','Nothing, your high-vis reflects','A whistle','A red flag'],a:0},
 async after(W){const l=flameSprite(0xfff2c0,2.5);l.position.set(.35,.9,-.3);player.add(l);await W.wait(1200)},
 why:'Carry a <b>lamp</b> in darkness, poor visibility or a tunnel.'},
{id:'A5',r:['A5'],sec:'A',t:'Before you set off',ref:'HB1 §4',
 set(W){W.speed(75);W.me(4,3.0,-Math.PI/2);W.cam([0,3,8],[8,1.5,1])},
 q:{t:'multi',p:'Before you walk on your own, what must you know?',o:['The maximum speed on each line','Which direction trains run on each line','Where there\'s limited clearance','Any places you mustn\'t go','Which company runs the trains','The drivers\' names'],a:[0,1,2,3]},
 why:'Know each line\'s <b>max speed</b> and <b>direction</b>, any <b>no-go areas</b>, and where there\'s <b>limited clearance</b>.'},
{id:'A6',r:['A6'],sec:'A',t:'What can you carry?',ref:'HB1 §4',
 set(W){W.P.bag(1.5,3.6);W.P.box(3.5,.7,3.4,1.2,.8,.6,0xc23b22);W.P.sign(3.5,3.9,['RAIL DRILL'],{y:.9,w:1,h:.3,face:0})},
 q:{t:'pick',p:'You\'re walking to site alone. What can you carry?',o:['Light hand tools only','The rail drill if you\'re careful','A trolley load of clips','Anything, as long as you stay in the cess'],a:0},
 why:'When walking alone you can only carry <b>light hand tools</b>, so you can get clear quickly.'},
{id:'A7',r:['A7'],sec:'A',t:'Can they hear the train?',ref:'HB1 §4',
 set(W){player.visible=false;const a=W.guy({x:0,z:3,phones:1,face:Math.PI*.15});const b=W.guy({x:2.5,z:3,hood:1,helmet:null,face:Math.PI*.15});const c=W.guy({x:5,z:3,face:Math.PI*.15});W.hzOn('phones',a);W.hzOn('hood',b);W.hzOn('ok',c);W.cam([2.5,2.6,12.5],[2.5,1.3,3])},
 q:{t:'spot',multi:1,p:'Tap anyone who might not see or hear a train coming.',a:['phones','hood'],labels:{phones:'HEADPHONES',hood:'HOOD UP'}},
 why:'Nothing that stops you <b>seeing or hearing</b> trains: no headphones, no hood up.'},
{id:'A8',r:['A8'],sec:'A',t:'Crossing at the points',ref:'HB1 §4',
 set(W){W.P.points(-2);W.me(4,2.6,Math.PI);W.cam([-2,4,5.5],[2,.4,0])},
 q:{t:'pick',p:'You need to cross the line by the points. Where do your feet go?',o:['Step over the rails onto the ballast: never on rails, sleepers or between the moving parts of points','Walk on the sleepers, they\'re flat','Step on the rail head, it\'s quicker','Cross between the switch blades'],a:0},
 why:'When crossing, <b>don\'t step on rails or sleepers</b>, or between the moving parts of points.'},
{id:'A9',r:['A9','C9'],sec:'A',t:'Phone rings',ref:'HB1 §4 & §10',
 set(W){W.me(-1,3.0)},
 async play(W){W.walk(player,3,3.0,1.6);S.ring();W.card('<div class="ring">📞<b>COSS calling…</b></div>');await W.wait(2200)},
 q:{t:'pick',p:'Your phone rings while you\'re walking in the cess.',o:['Get to a position of safety and stand still, then answer','Answer while you keep walking','Step into the four-foot where it\'s quieter','Answer but keep looking up'],a:0},
 async after(W){W.uncard();W.pose(player,'phone');await W.wait(900)},
 why:'Before using a phone or radio, <b>move to a position of safety and stand still</b>.'},
{id:'A10',r:['A10'],sec:'A',t:'Keep looking up',ref:'HB1 §4',
 set(W){W.me(-8,3.0)},
 q:{t:'look',p:'Walk to site. Tap <b>LOOK UP</b> at least every 5 seconds.'},
 why:'When walking on or near the line, <b>look up at least every 5 seconds</b> so you see trains in time.'},
{id:'A11',r:['A11'],sec:'A',t:'How early?',ref:'HB1 §4',
 set(W){W.speed(100);W.me(2,R1+1.6);W.cam([-6,3.2,9],[10,1.8,0])},
 async play(W){upTrain.visible=true;upTrain.position.x=170;await tween(2,k=>upTrain.position.x=170-90*k)},
 q:{t:'pick',p:'Train in sight. How long before it reaches you must you be in your position of safety?',o:['At least 10 seconds before','When it sounds its horn','2 seconds before','When you feel the rail vibrate'],a:0},
 async after(W){await runTrain(upTrain,80,-212,44)},
 why:'Be in your position of safety <b>at least 10 seconds</b> before the train arrives.'},
{id:'A12',r:['A12'],sec:'A',t:'After the train passes',ref:'HB1 §4',
 set(W){W.me(1,R1+1.6);W.cam([-7,3.2,9],[3,1.4,-1])},
 async play(W){await W.train('up',{speed:32})},
 q:{t:'pick',p:'The train\'s gone past. When can you step back on?',o:['When it\'s passed and you\'ve checked nothing else is coming on any line','As soon as the last coach passes','When the driver waves','After counting to ten'],a:0},
 async after(W){banner('Another train on the Down line…');await W.train('down',{speed:30});banner('')},
 why:'Stay put until the train has passed <b>and no other train is coming</b>. Trains often pass each other.'},
{id:'A13',r:['A13'],sec:'A',t:'Joining a group',ref:'HB1 §4',
 set(W){cast(coss,6,3.0,Math.PI/2);for(let i=0;i<3;i++)W.guy({x:7.5+i*1.3,z:0,face:-Math.PI/2});W.me(0,3.0);W.cam([-5,3.6,10],[4,1,1])},
 q:{t:'pick',p:'You\'ve been sent to join a group already working.',o:['Speak to the COSS first, agree your access point and destination, and don\'t walk until briefed','Walk to the group and start','Ask a mate what\'s going on and crack on','Get briefed by the lookout'],a:0},
 why:'<b>Speak to the COSS first.</b> Agree where you\'ll get on and where you\'re going, and don\'t walk to site until you\'ve been briefed.'},
{id:'A14',r:['A14'],sec:'A',t:'Leaving early',ref:'HB1 §4',
 set(W){cast(coss,4,3.0,Math.PI/2);W.guy({x:7,z:0,face:-Math.PI/2});W.me(2,3.0,Math.PI/2)},
 q:{t:'pick',p:'You need to leave the group early.',o:['Tell the COSS, and agree where you\'re going and the route','Just go, you\'re PTS','Tell a mate to let the COSS know','Text the COSS once you\'re off'],a:0},
 why:'<b>Tell the COSS</b> before leaving, and agree your destination and route.'},
{id:'A15',r:['A15'],sec:'A',t:'Blocked cess',ref:'HB1 §4',
 set(W){W.P.rails(6,3.0);W.me(-2,3.0);W.cam([-8,3.6,9],[5,.8,1.5])},
 q:{t:'pick',p:'You\'re walking alone to site. A stack of rails blocks the cess. The only way past is on the open line.',o:['Stop, tell the COSS, and do what they say','Nip round in the four-foot quickly','Climb over the rails','Wait for a gap in trains and go'],a:0},
 why:'If an obstacle would force you onto an open line, <b>tell the COSS</b> and follow their instructions.'},
// ---------- WORKING IN A GROUP ----------
{id:'W1',r:['W1'],sec:'W',t:'COSS nips off',ref:'HB1 §5',
 set(W){cast(coss,3,3.0,0);W.me(0,0,-Math.PI/2);W.guy({x:2,z:0,face:-Math.PI/2})},
 async play(W){W.say(coss,'Back in 10 mins, crack on',2400);await W.walk(coss,3,7,2)},
 q:{t:'pick',p:'The COSS heads back to the van for ten minutes and tells you to crack on.',o:['Stop and get clear until the COSS is back, or another COSS takes over','Crack on, the lookout\'s here','Crack on but work faster','Keep going if no trains are due'],a:0},
 why:'Only go on with others if a <b>COSS is present and stays with you</b>.'},
{id:'W2',r:['W2'],sec:'W',t:'Who\'s the COSS?',ref:'HB1 §5',
 set(W){player.visible=false;const a=W.guy({x:0,z:3,face:0});const b=W.guy({x:2.4,z:3,face:0,coss:1,helmet:0x2b5fd6});const c=W.guy({x:4.8,z:3,face:0});W.hzOn('a',a);W.hzOn('coss',b);W.hzOn('c',c);W.cam([2.4,2.5,12.5],[2.4,1.3,3])},
 q:{t:'spot',p:'You\'ve just arrived on site. Tap the COSS.',a:'coss',labels:{coss:'COSS ARMLET'}},
 why:'The COSS wears an <b>armlet on the left arm</b> or a <b>chest badge</b>. If you\'re not sure, ask.'},
{id:'W3',r:['W3'],sec:'W',t:'The briefing',ref:'HB1 §5',
 set(W){cast(coss,3,3.0,Math.PI/2);W.me(0,3.0);W.guy({x:-1.2,z:3.6,face:-Math.PI/2})},
 async play(W){W.say(coss,'…and your position of safety is…',2400);S.trainHorn();await W.wait(2500)},
 q:{t:'pick',p:'A train went past mid-briefing and you didn\'t catch where your position of safety is.',o:['Ask the COSS','Sign and ask a mate later','Follow everyone else','Work it out when the warning comes'],a:0},
 why:'Make sure you <b>understand the briefing</b>. If anything is unclear, ask the COSS.'},
{id:'W4',r:['W4'],sec:'W',t:'The briefing form',ref:'HB1 §5',
 set(W){cast(coss,2,3.0,Math.PI/2);W.me(0,3.0);W.card('<div class="form"><b>RT9909</b><span>Safe work pack · briefing record</span><i>Signature: ______</i></div>')},
 q:{t:'pick',p:'The COSS hands you the RT9909.',o:['Sign it once you\'ve been briefed and understand it','Sign it first to save time','Sign for your mate as well','Don\'t bother, it\'s optional'],a:0},
 why:'<b>Sign the RT9909</b> to confirm you\'ve been briefed and understood it. Never sign for anyone else.'},
{id:'W5',r:['W5'],sec:'W',t:'Behind the barrier',ref:'HB1 §5',
 set(W){W.P.barrier('rigid',-6,8,-1.7);player.visible=false;const m=W.guy({x:-1,z:-1.25,face:Math.PI});m.userData.pose='lean';W.P.tool(3,-1.45,.45);W.P.bag(5.5,1.6,0x2b5fd6);W.hz('lean',-1,1,-1.3,1,2,1);W.hz('spade',3,1,-1.4,1,1.6,1);W.hz('bag',5.5,.6,1.6,1,1,1);W.cam([.6,3.6,6.8],[.8,.8,-1.4])},
 q:{t:'spot',multi:1,p:'Trains are running on the Down line. Tap anything wrong with how the barrier is being used.',a:['lean','spade'],labels:{lean:'LEANING ON IT',spade:'TOOL ON IT'}},
 why:'<b>Never lean on</b> a safety barrier or <b>rest tools</b> against it.'},
{id:'W6a',r:['W6'],sec:'W',t:'Lookout warning!',ref:'HB1 §5',
 set(W){W.me(1,0,-Math.PI/2);player.userData.pose='kneel';cast(lookout,9,3.2,-Math.PI/2);W.guy({x:3,z:0,face:-Math.PI/2});W.cam([-5,4.4,8.5],[3.5,.6,1])},
 async play(W){await W.wait(600);S.lookoutHorn();W.pose(lookout,'one');player.userData.pose='stand'},
 q:{t:'tap',walk:1,time:5,p:'Lookout\'s warning! Tap where you go.',z:[{id:'a',x:1,z:R1+1.8,l:'A'},{id:'b',x:1,z:-1.7,l:'B'},{id:'c',x:2,z:0,l:'C: finish the bolt'}],a:'a'},
 async after(W,ok){W.pose(lookout,null);if(ok)await W.train('up',{speed:30});else await W.wait(800)},
 why:'On a warning: <b>stop work, acknowledge, and go straight to your position of safety</b>. Never finish the job first.'},
{id:'W6b',r:['W6'],sec:'W',t:'Train\'s gone',ref:'HB1 §5',
 set(W){W.me(1,R1+1.8);cast(coss,-3,3.0,-Math.PI/2);W.guy({x:2.5,z:R1+1.8})},
 async play(W){await W.train('up',{speed:32})},
 q:{t:'pick',p:'The train\'s passed. When do you go back on the track?',o:['When the COSS says so','When the lookout stops sounding','Straight away','When you can\'t hear the train'],a:0},
 why:'Stay in your position of safety <b>until the COSS tells you</b> it\'s safe to go back.'},
{id:'W7',r:['W7'],sec:'W',t:'What does that mean?',ref:'HB1 §5',
 set(W){W.me(1,0,-Math.PI/2);cast(lookout,7,3.2,-Math.PI/2);W.cam([-5,3.6,9],[4,1,1])},
 async play(W){await W.wait(500);W.pose(lookout,'one');S.urgent();await W.wait(2000);W.pose(lookout,null)},
 q:{t:'pick',p:'That was a series of short, sharp blasts. What does it mean?',o:['Urgent warning: get clear immediately','Normal warning: a train\'s coming','All clear','Testing the horn'],a:0},
 why:'A series of <b>short, sharp blasts</b> is an urgent warning. Get to safety at once.'},
{id:'W8',r:['W8'],sec:'W',t:'Chatting to the lookout',ref:'HB1 §5',
 set(W){cast(lookout,8,3.2,-Math.PI/2);cast(mate,2,3.0,-Math.PI/2);W.cam([-4,3.4,9],[5,1,2])},
 async play(W){W.say(mate,'Did you see the match?',2400);await W.walk(mate,6.6,3.2,1.8)},
 q:{t:'pick',p:'Your mate wanders over to chat to the lookout.',o:['Tell him to leave the lookout alone','Join in, it\'s a quiet line','Leave it','Offer to cover for the lookout'],a:0},
 why:'<b>Never distract a lookout.</b> Their only job is watching for trains.'},
{id:'W9',r:['W9'],sec:'W',t:'Site warden',ref:'HB1 §5',
 set(W){W.P.barrier('tape',-8,10,-1.5);W.guy({x:-6,z:-.6,tag:'SITE WARDEN',face:-Math.PI/2});W.me(3,-1.2,Math.PI);W.cam([-3,5,8],[2,.5,-1])},
 async play(W){await W.wait(500);S.whistle();W.say(tmpPeople[0],'Stay in the safe area!',2200);await W.wait(1600)},
 q:{t:'pick',p:'The site warden gives a warning. You\'re working near the edge of the fenced area.',o:['Check you\'re inside the safe area, and step back in if not','Run to the cess','Ignore it, it\'s for another gang','Stop and wait for the train'],a:0},
 why:'On a site warden\'s warning, <b>check you\'re in the safe area</b> and step back into it if you\'re not.'},
{id:'W10',r:['W10'],sec:'W',t:'ATWS goes off',ref:'HB1 §5',
 set(W){for(const x of[-8,0,8])W.P.hornUnit(x,4.2);W.me(1,0,-Math.PI/2);cast(coss,-3,3.0,0);W.cam([-6,3.6,8],[2,1,1])},
 async play(W){await W.wait(400);S.siren();await W.wait(2200)},
 q:{t:'pick',p:'The automatic warning goes off.',o:['Go to your position of safety and stay until the COSS says','Finish what you\'re doing first','Go to safety until the noise stops','Look for the train and decide'],a:0},
 why:'For ATWS, SATWS, TOWS or LOWS warnings: <b>go to safety and stay until the COSS says</b> it\'s safe.'},
{id:'W11',r:['W11'],sec:'W',t:'Spoil heap in the way',ref:'HB1 §5',
 set(W){W.P.spoil(6,3.0);cast(coss,-2,3.0,-Math.PI/2);for(let i=0;i<3;i++)W.guy({x:-4-i*1.3,z:3.0,face:-Math.PI/2});W.me(0,3.0);W.cam([-9,4,9],[4,.8,1.5])},
 q:{t:'pick',p:'A spoil heap blocks the cess. Your group can only get past on the open line.',o:['The COSS arranges a safe way past','Each person picks their own moment','Whoever\'s at the front decides','Go round it quickly in single file'],a:0},
 why:'The <b>COSS must arrange a safe way</b> past obstacles that would put the group on an open line.'},
{id:'W12',r:['W12'],sec:'W',t:'Crossing the Down line',ref:'HB1 §5',
 set(W){cast(coss,2,3.0,Math.PI);for(let i=0;i<3;i++)W.guy({x:-1-i*1.3,z:3.0,face:Math.PI});W.me(0,3.0,Math.PI);W.cam([-6,5,9],[1,.5,-1.5])},
 q:{t:'pick',p:'Your group needs to cross the open Down line to the other side.',o:['Only cross once the COSS has explained how','Cross when you can\'t see a train','Cross one at a time on your own judgement','Follow the lookout'],a:0},
 why:'Only cross open lines <b>after the COSS has explained the arrangements</b>.'},
{id:'W13',r:['W13'],sec:'W',t:'Route-proving train stops',ref:'HB1 §5',
 set(W){upTrain.visible=true;upTrain.position.x=-12;W.me(-2,1.75,-Math.PI/2);player.visible=false;W.cam([-6,3.4,9],[2,2,0])},
 q:{t:'pick',p:'You\'re on a route-proving train. It stops at your site.',o:['Wait until the COSS has explained, then get off','Get off as soon as it stops','Get off on whichever side is nearest','Get off while it\'s slowing down'],a:0},
 why:'On route proving, <b>only get off once the COSS has explained</b> the arrangements.'},
{id:'W14',r:['W14'],sec:'W',t:'Ready to move?',ref:'HB1 §5',
 set(W){upTrain.visible=true;upTrain.position.x=-12;cast(coss,4,3.0,Math.PI/2);W.me(6,3.0,Math.PI/2);W.guy({x:8,z:-1.7})},
 q:{t:'pick',p:'You\'re all back on board. The driver asks if he can move.',o:['Not until the COSS confirms everyone and everything is clear','Yes, if you can see your mates','Yes, if the lookout agrees','Yes, slowly'],a:0},
 why:'The protecting train must not move <b>until the COSS confirms</b> everyone and everything is clear.'},
{id:'W15',r:['W15'],sec:'W',t:'Gangway door, wires overhead',ref:'HB1 §5',
 set(W){W.P.ole(-60,60);upTrain.visible=true;upTrain.position.x=-30;W.me(-8.5,1.8,-Math.PI/2);W.cam([-15,4,8],[-9,3,0])},
 q:{t:'pick',p:'There are overhead wires here. The quickest way down to the track is the gangway door at the end of the coach.',o:['Don\'t: never use gangway doors to get to the track in an OLE area','Fine if you\'re quick','Fine if the COSS is watching','Fine with gloves on'],a:0},
 why:'In an overhead line (OLE) area, <b>never use gangway doors</b> to get to the track.'},
// ---------- REPORTING ----------
{id:'R1',r:['R1'],sec:'R',t:'Mate goes over',ref:'HB1 §6',
 set(W){cast(mate,3,3.0,0);mate.userData.pose='kneel';W.say(mate,'Argh, my ankle',3000);W.cam([-4,3,8],[3,.8,2.5])},
 q:{t:'pick',p:'Your mate trips over a cable and hurts his ankle. No trains involved.',o:['Report it as soon as possible to the person in charge, signaller or Ops Control','Report it at the end of the shift','Only report it if he goes to hospital','Don\'t report it if he carries on'],a:0},
 why:'Report accidents <b>as soon as possible</b> to the person in charge, the signaller or Operations Control.'},
{id:'R2',r:['R2'],sec:'R',t:'Making the call',ref:'HB1 §6',
 set(W){cast(mate,3,3.0,0);mate.userData.pose='kneel';W.pose(player,'phone')},
 q:{t:'pick',chat:[['Signaller','Signaller, go ahead.']],p:'You\'re reporting a serious accident. How do you start?',o:['"This is an emergency call"','"Hi, it\'s me from the gang"','"Urgent, urgent"','"Mayday, mayday"'],a:0},
 why:'Start with <b>"This is an emergency call"</b> so everyone knows what\'s coming.'},
{id:'R3',r:['R3'],sec:'R',t:'What do you tell them?',ref:'HB1 §6',
 set(W){cast(mate,3,3.0,0);mate.userData.pose='kneel';W.pose(player,'phone')},
 q:{t:'multi',chat:[['You','This is an emergency call.'],['Signaller','Go ahead.']],p:'What do you give the signaller?',o:['Your name','Your exact location','What happened','Whether any lines are blocked','Which emergency services are needed','Your shift pattern'],a:[0,1,2,3,4]},
 why:'Give your <b>name, exact location, what happened, whether lines are obstructed</b>, and which <b>services</b> are needed.'},
{id:'R4',r:['R4'],sec:'R',t:'Close one',ref:'HB1 §6',
 set(W){cast(mate,3,0,-Math.PI/2);W.me(1,0,-Math.PI/2);W.P.tool(3.6,.9,1.57)},
 q:{t:'pick',p:'A hammer slips out of someone\'s hand and lands next to your mate. Nobody\'s hurt.',o:['Report it to your supervisor as a near miss','Nothing to report, nobody\'s hurt','Just tell everyone to be careful','Only report it if the COSS saw'],a:0},
 why:'Report <b>all accidents and near misses</b> to your supervisor. Near misses are how the next accident gets stopped.'},
{id:'R5',r:['R5'],sec:'R',t:'Tank wagon leaking',ref:'HB1 §6',
 set(W){W.P.tank(4,0,true);addSmoke(extras,3,.5,1.2,3,false);W.P.water(3,1.6,4,1.5);W.me(-8,3.6,-Math.PI/2);W.pose(player,'phone');W.cam([-12,3.4,9],[3,2,1])},
 q:{t:'pick',p:'A tank wagon has derailed and is leaking. How do you start the call?',o:['"This is a rail dangerous goods emergency", then the UN number off the orange plate','"This is an emergency call", then "chemical leak"','Describe the colour of the tank','Wait until you know what it is'],a:0},
 why:'Say <b>"This is a rail dangerous goods emergency"</b> and give the <b>UN number</b> (bottom of the orange plate, here 1203).'},
{id:'R6',r:['R6'],sec:'R',t:'Where do you wait?',ref:'HB1 §6',
 set(W){W.P.tank(2,0,true);addSmoke(extras,2,.5,1.2,5,false);W.P.windsock(-4,5.5);W.P.mound(-15,8);W.P.ditch(-12,-8);W.me(-4,3.0);W.cam([-6,10,16],[-4,0,0])},
 q:{t:'tap',p:'Gas is drifting off the wagon. Tap where you\'ll wait for the emergency services.',z:[{id:'a',x:12,z:3,l:'A'},{id:'b',x:-15,z:8,y:1.25,l:'B'},{id:'c',x:-12,z:-8,l:'C'}],a:'b'},
 why:'Keep well clear with the <b>wind behind you</b> (upwind), <b>avoid low ground</b> like ditches, and keep people away. B is upwind and high.'},
{id:'R7',r:['R7'],sec:'R',t:'Lighting up',ref:'HB1 §6',
 set(W){W.P.tank(6,0,true);W.P.water(5,1.6,4,1.5);cast(mate,-1,3.2,-Math.PI/2);W.pose(mate,'phone');const f=flameSprite(0xffa020,.35);f.position.set(-.85,1.75,3.0);W.P.add(f);W.cam([-6,3,8],[2,1.4,2])},
 q:{t:'pick',p:'Your mate lights a cigarette near the leaking tank of petrol.',o:['Stop him: no smoking, naked lights or phones near a flammable load','Fine if he stands upwind','Fine if he stays out of the four-foot','Fine if it\'s only leaking a bit'],a:0},
 why:'<b>No naked lights, smoking or mobile phones</b> near a flammable load.'},
{id:'R8',r:['R8'],sec:'R',t:'Splashed',ref:'HB1 §6',
 set(W){cast(mate,2,3.0,-Math.PI/2);W.say(mate,'It\'s on my hand and sleeve',3000)},
 q:{t:'pick',p:'Some of the leaking chemical splashed onto your mate\'s hand and sleeve.',o:['Wash with plenty of cold water, take contaminated clothing off carefully, get medical help','Wipe it off with a rag','Wash it with hot water','Wait and see if it hurts'],a:0},
 why:'Wash with <b>plenty of cold water</b>, remove contaminated clothing carefully, and <b>get medical help</b>.'},
// ---------- HAZARDS ----------
{id:'H1',r:['H1'],sec:'H',t:'Where\'s the kit?',ref:'HB1 §7',
 set(W){W.P.bag(2,R1+.8);W.P.bag(6,R1+3.1,0x2b5fd6);W.hz('near',2,.5,R1+.8,1.2,1,1);W.hz('far',6,.5,R1+3.1,1.2,1,1);W.cam([-3,4,9],[3,.3,2])},
 q:{t:'spot',p:'Trains are running on this line. Tap the kit that\'s in the wrong place.',a:'near',labels:{near:'UNDER 2 m'}},
 async after(W){await W.train('up',{speed:30})},
 why:'Don\'t put tools or equipment <b>within 2 m</b> of a line where trains can run, unless it\'s designed to stay put in a train\'s slipstream.'},
{id:'H2',r:['H2'],sec:'H',t:'Boundary check',ref:'HB1 §7',
 set(W){W.P.gate(.5,true);W.P.gap(-4);W.hz('gate',2,1,5.4,3,2,1.5);W.hz('fence',-4,1,5.4,2.6,2,1.5);player.visible=false;W.cam([-1,4.5,-7.5],[-1,1,5])},
 q:{t:'spot',multi:1,p:'Tap the problems with the boundary.',a:['gate','fence'],labels:{gate:'GATE LEFT OPEN',fence:'DAMAGED FENCE'}},
 why:'Keep access gates <b>closed and locked</b>, and <b>report damaged fencing</b>.'},
{id:'H3',r:['H3'],sec:'H',t:'Kids on the bank',ref:'HB1 §7',
 set(W){W.P.gap(4);W.P.kid(3,4.0,0x3a5fcd);W.P.kid(5,3.8,0xc23b22);W.me(-6,3.0);W.cam([0,3,11],[3.5,1,3.5])},
 q:{t:'pick',p:'Two kids are messing about inside the fence.',o:['Report it straight away','Chase them off yourself','Ignore them, they\'re not on the track','Film them for evidence'],a:0},
 why:'<b>Report suspected trespassers</b> right away. Don\'t chase them.'},
{id:'H4',r:['H4'],sec:'H',t:'Smoke by the line',ref:'HB1 §7',
 set(W){W.P.fire(5,.2,4.0);W.me(-2,3.0);W.cam([-5,3.4,10],[4,1.2,3])},
 q:{t:'pick',p:'The vegetation by the line is on fire.',o:['Report it immediately','Try to put it out, then decide','Ignore it, it\'s not on the track','Mention it at the end of the shift'],a:0},
 why:'<b>Report lineside fires immediately.</b>'},
{id:'H5',r:['H5'],sec:'H',t:'Water by the bridge',ref:'HB1 §7',
 set(W){W.P.bridge(10);W.P.water(6,2.8,5,2.2);W.P.water(2,3.6,3,1);W.me(-3,3.0);W.cam([-6,3.4,9],[6,1,2.5])},
 q:{t:'pick',p:'There\'s water flowing and pooling by the bridge abutment.',o:['Report it','Ignore it, it\'s only water','Dig a channel to drain it','Report it if it\'s still there next week'],a:0},
 why:'<b>Report flowing or pooling water</b> near structures or earthworks. It can mean a washout or slip.'},
{id:'H6',r:['H6'],sec:'H',t:'Something on that freight',ref:'HB1 §7',
 set(W){W.me(-2,R1+1.8);W.cam([-9,3,10],[6,2,0])},
 async play(W){await W.freight({shifted:1,follow:1})},
 q:{t:'pick',p:'That freight train had a shifted container and a flapping sheet. What do you do?',o:['Report it straight away','Nothing, the driver will know','Mention it at the end of the shift','Wave at the driver'],a:0},
 why:'Report unsafe trains straight away: <b>open doors, insecure loads, fire, a hot axle box</b>. Scene K covers these in full.'},
{id:'H7',r:['H7'],sec:'H',t:'Check the back',ref:'HB1 §7',
 set(W){W.me(-2,R1+1.8);W.cam([-9,3,10],[6,2,0])},
 async play(W){await W.freight({tail:false,follow:1,speed:20})},
 q:{t:'pick',p:'Did you see anything wrong as it went past?',o:['Yes: no tail lamp on the back','No, all fine','Yes: the headlights were off','Yes: a door was open'],a:0},
 why:'<b>Report a missing or unlit tail lamp</b> (or headlight). No tail lamp can mean part of the train has been left behind.'},
{id:'H8',r:['H8'],sec:'H',t:'That horn',ref:'HB1 §7',
 set(W){W.me(-2,R1+1.8);W.cam([-8,3,9],[10,2,0])},
 async play(W){upTrain.visible=true;upTrain.position.x=170;S.distress();await tween(3.6,k=>upTrain.position.x=170-70*k)},
 q:{t:'pick',p:'The driver sounds a series of continuous long blasts.',o:['The train is in distress and needs help','The driver is saying hello','A normal warning to you','The train is about to reverse'],a:0},
 async after(W){await runTrain(upTrain,100,-212,30)},
 why:'Continuous long blasts = <b>train in distress</b>. Flashing headlights = a <b>hazard warning</b>. Either way, report it.'},
{id:'H9',r:['H9'],sec:'H',t:'Power line down',ref:'HB1 §7',
 set(W){W.P.poles(10);W.me(-4,3.0);W.cam([-6,6,12],[5,1,1])},
 q:{t:'tap',walk:1,p:'An electricity company\'s power line has come down across the track. Tap where you\'ll wait.',z:[{id:'a',x:8,z:3,l:'A'},{id:'b',x:6,z:3,l:'B'},{id:'c',x:3,z:3,l:'C'}],a:'c'},
 why:'Keep at least <b>5 m</b> from a fallen power line until the electricity company says it\'s safe. A is 2 m, B is 4 m, C is 7 m.'},
// ---------- EMERGENCIES ----------
{id:'E1',r:['E1'],sec:'E',t:'Stop the trains?',ref:'HB1 §8',
 set(W){W.P.tree(4,0);W.me(-2,3.0);W.cam([-6,4,9],[3,.6,0])},
 q:{t:'multi',p:'Which of these mean trains need to be stopped?',o:['A broken rail','Flood water over the track','A tree across the line','Large animals on the line','A fire next to the track','A damaged bridge','Litter in the cess','Graffiti on a wall'],a:[0,1,2,3,4,5]},
 why:'Stop trains for anything that makes the line unsafe: <b>track defects, flooding, obstructions, fire, damaged structures, large animals</b>.'},
{id:'E2',r:['E2'],sec:'E',t:'Who to tell',ref:'HB1 §8',
 set(W){W.P.tree(4,0);W.me(-2,3.0);W.pose(player,'phone');W.cam([-6,4,9],[3,.6,0])},
 q:{t:'pick',p:'You\'ve found a tree across the line. Who do you tell, and when?',o:['The person in charge, signaller or Ops Control, immediately','Your supervisor at the end of the shift','Nobody, the driver will see it','Post it in the group chat'],a:0},
 why:'Tell the <b>person in charge, signaller or Operations Control immediately</b>.'},
{id:'E3',r:['E3'],sec:'E',t:'Stop that train',ref:'HB1 §8',
 set(W){W.P.tree(-8,0);W.me(8,3.0,-Math.PI/2);W.cam([0,3.6,9],[14,1.8,1])},
 async play(W){upTrain.visible=true;upTrain.position.x=200;await tween(1.6,k=>upTrain.position.x=200-40*k)},
 q:{t:'pick',p:'Train coming towards the tree. You\'ve got no flag. How do you signal the driver to stop?',o:['Raise both arms above your head','Raise one arm above your head','Point at the tree','Wave one arm side to side'],a:0},
 async after(W,ok){if(ok){W.pose(player,'two');S.trainHorn();await W.train('up',{from:160,stopAt:22,speed:30});await W.wait(500);W.pose(player,null)}else{W.pose(player,'one');await W.wait(900)}},
 why:'In daylight: wave a <b>red flag</b>, or if you haven\'t got one, raise <b>both arms above your head</b>.'},
{id:'E4',r:['E4'],sec:'E',t:'Stopping a train from a vehicle',ref:'HB1 §8',
 set(W){W.P.trolley(4);W.me(4,.9,-Math.PI/2,1.0);W.cam([-3,3.4,8],[10,1.6,0])},
 q:{t:'pick',p:'You\'re on a vehicle on the line and need to stop an approaching train. What\'s the hand signal?',o:['One arm held out horizontally','Both arms above your head','One arm above your head','Thumbs down'],a:0},
 async after(W){W.pose(player,'out');await W.wait(1200)},
 why:'From a vehicle, the emergency stop hand signal is <b>one arm held out horizontally</b>.'},
{id:'E5',r:['E5'],sec:'E',t:'Night, white torch only',ref:'HB1 §8',
 set(W){W.night(true);W.P.tree(-8,0);W.me(8,3.0,-Math.PI/2);const l=flameSprite(0xfff2c0,1.6);l.position.set(.4,.8,-.3);player.add(l);W.cam([0,3.6,9],[14,1.8,1])},
 q:{t:'pick',p:'It\'s dark and you need to stop a train. You\'ve only got a white torch.',o:['Wave it violently','Hold it still, pointed at the train','Switch it off','Flash it on and off slowly'],a:0},
 why:'In darkness or poor visibility: show a <b>red light</b>, or if you haven\'t got one, wave <b>any light violently</b>.'},
// ---------- COMMUNICATION ----------
{id:'C1',r:['C1'],sec:'C',t:'Calling the signaller',ref:'HB1 §10',
 set(W){W.pose(player,'phone')},
 q:{t:'pick',chat:[['Signaller','Westfield panel, signaller speaking.']],p:'What do you say first?',o:['Confirm who you\'re talking to, then give your location, name, employer and what you\'re doing','Ask if the line is clear','Just your first name','"It\'s me"'],a:0},
 why:'<b>Confirm who you\'re speaking to</b>, then give your <b>location, name, employer and task</b>.'},
{id:'C2',r:['C2'],sec:'C',t:'Tree on the Down',ref:'HB1 §10',
 set(W){W.P.tree(4,-3.4);W.pose(player,'phone')},
 q:{t:'pick',chat:[['Signaller','Can I run trains on the Down line?']],p:'There\'s a tree across it. What do you say?',o:['"Line blocked"','"Not clear"','"Hold on"','"Negative"'],a:0},
 why:'Say <b>"line blocked"</b>. Never say "not clear": over a bad line it can be heard as "clear".'},
{id:'C3',r:['C3'],sec:'C',t:'Give the signal number',ref:'HB1 §10',
 set(W){W.P.sign(5,2.3,['WF 8107'],{y:2.2,w:1.2,h:.45,bg:'#fff'});W.pose(player,'phone');W.cam([-2,2.6,7],[5,2,2])},
 q:{t:'pick',p:'You\'re telling the signaller you\'re at signal 8107. How do you say the number?',o:['"Eight-one-zero-seven"','"Eighty-one oh seven"','"Eight thousand one hundred and seven"','"Eighty-one-seven"'],a:0},
 why:'Say numbers <b>one digit at a time</b>. The exceptions are times and Rule Book references.'},
{id:'C4',r:['C4'],sec:'C',t:'Got the message?',ref:'HB1 §10',
 set(W){W.pose(player,'phone')},
 q:{t:'pick',chat:[['Signaller','Line blocked on the Down between signals eight-one-zero-seven and eight-one-zero-nine.']],p:'What do you do?',o:['Repeat the message back','Say "Got it"','Say "Okay, cheers"','Nothing, they know you heard'],a:0},
 why:'<b>Repeat messages back</b> so both of you know it was understood correctly.'},
{id:'C5',r:['C5'],sec:'C',t:'Who leads?',ref:'HB1 §10',
 set(W){cast(coss,3,3.0,Math.PI/2);W.pose(coss,'phone')},
 q:{t:'pick',p:'The COSS is on the phone to the signaller. Who leads the conversation?',o:['The signaller','The COSS','Whoever made the call','Whoever is more senior'],a:0},
 why:'There\'s a set order: the <b>ECO</b> leads with anyone, then the <b>signaller</b>, then PICOP and so on. With the group and lookouts, the <b>COSS</b> leads.'},
{id:'C6',r:['C6'],sec:'C',t:'Wrong number',ref:'HB1 §10',
 set(W){W.pose(player,'phone')},
 q:{t:'pick',chat:[['You','I\'m at signal eight-zero-one-seven.']],p:'You realise you meant 8107. What do you say?',o:['"Correction", then the right number','"Sorry" and carry on','Hang up and call back','Leave it, it\'s close enough'],a:0},
 why:'Use <b>"Correction"</b> to fix a mistake, and <b>"Repeat back"</b> to ask for a message to be repeated.'},
{id:'C7',r:['C7'],sec:'C',t:'Ending a radio message',ref:'HB1 §10',
 set(W){W.pose(player,'phone')},
 q:{t:'pick',chat:[['You','COSS to lookout: group is clear of the Up line.']],p:'No reply is needed. How do you end it?',o:['"Out"','"Over"','"Over and out"','"Roger"'],a:0},
 why:'<b>"Over"</b> = I expect a reply. <b>"Out"</b> = no reply needed. Never both together.'},
{id:'C8',r:['C8'],sec:'C',t:'Bad line',ref:'HB1 §10',
 set(W){W.pose(player,'phone');W.P.sign(5,2.3,['DE 123'],{y:2.2,w:1.2,h:.45,bg:'#fff'});W.cam([-2,2.6,7],[5,2,2])},
 q:{t:'pick',p:'The radio is breaking up. How do you give the signal ID "DE 123"?',o:['"Delta Echo one-two-three"','"D for dog, E for egg, one two three"','"DE one hundred and twenty-three"','"Dee-ee one-two-three"'],a:0},
 why:'Use the <b>phonetic alphabet</b> for signal and points IDs, for spelling, and when the line is bad.'},
{id:'C9',r:['C9'],sec:'C',t:'Radio crackles',ref:'HB1 §10',
 set(W){W.me(1,0,-Math.PI/2);player.userData.pose='kneel'},
 async play(W){S.radio();W.card('<div class="ring">📻<b>"COSS to Phil, over"</b></div>');await W.wait(2000)},
 q:{t:'pick',p:'You\'re working in the four-foot when the radio goes.',o:['Get to a position of safety before you use it','Answer straight away','Answer while you finish the job','Ignore it'],a:0},
 async after(W){W.uncard()},
 why:'Be in a <b>position of safety</b> before using a radio or phone.'},
{id:'C10',r:['C10'],sec:'C',t:'Conference call',ref:'HB1 §10',
 set(W){W.pose(player,'phone');W.card('<div class="ring">👥<b>Group call · 9 people</b><small>"Tonight\'s safety briefing…"</small></div>')},
 q:{t:'pick',p:'The supervisor sets up a group call to give everyone tonight\'s safety instructions.',o:['Not allowed: safety instructions aren\'t given on group or conference calls, except in emergencies','Fine if everyone repeats back','Fine if it\'s recorded','Fine at night'],a:0},
 why:'<b>No group or conference calls</b> for safety-critical instructions, except in an emergency.'},
// ---------- SIGNS ----------
{id:'S1',r:['S1'],sec:'S',t:'Sign under the bridge',ref:'HB1 §11',
 set(W){W.P.bridge(20);W.P.sign(17.4,2.25,['WARNING','LIMITED','CLEARANCE'],{wall:1,y:1.2,w:1.9,h:1.3,bg:'#fff',fg:'#d02020',chq:1});player.visible=false;W.cam([8,2.6,4.6],[17.4,1.9,2.25])},
 q:{t:'pick',p:'You\'re walking towards the bridge and see this sign.',o:['There\'s no position of safety on this side: don\'t be here when trains are running','Low bridge, mind your head','Trains slow down here','Speed restriction ahead'],a:0},
 why:'The red and white chequered <b>Warning: limited clearance</b> board means <b>no position of safety on this side</b>. Don\'t stand there while trains are running.'},
{id:'S2',r:['S2'],sec:'S',t:'Refuges sign',ref:'HB1 §11',
 set(W){W.P.bridge(20);W.P.sign(17.4,2.25,['NO REFUGES','THIS SIDE','→ OTHER SIDE'],{wall:1,y:1.2,w:1.8,h:1.3,bg:'#fff',fg:'#111',border:'#111'});player.visible=false;W.cam([8,2.6,4.6],[17.4,1.9,2.25])},
 q:{t:'pick',p:'What does this sign tell you?',o:['The refuges are on the other side of the line','There are no refuges anywhere here','A refuge is coming up shortly','Don\'t walk any further'],a:0},
 why:'It tells you the <b>refuges are on the other side</b>.'},
{id:'S3',r:['S3'],sec:'S',t:'Red circle sign',ref:'HB1 §11',
 set(W){W.P.sign(12,2.4,['⛔ NO ACCESS','WHILE TRAINS','ARE RUNNING'],{y:1.2,w:1.6,h:1.3,bg:'#fff',fg:'#b01010',border:'#d02020'});player.visible=false;W.cam([5,2.6,5.2],[12,1.8,2.4])},
 q:{t:'pick',p:'You reach this prohibition sign. What does it mean?',o:['Don\'t pass it while trains are running (except to protect a train in an emergency)','No smoking','No stopping','Staff only, carry on'],a:0},
 why:'A prohibition sign means <b>don\'t pass it while trains are running</b>, except to give emergency protection.'},
{id:'S4',r:['S4'],sec:'S',t:'Phone under the bridge',ref:'HB1 §11',
 set(W){W.P.bridge(20);W.P.box(17.3,1.3,2.25,.3,.6,.5,0x6b7078);{const r=new THREE.Mesh(new THREE.CircleGeometry(.16,24),basic(0xf5d000));r.position.set(17.13,1.42,2.25);r.rotation.y=-Math.PI/2;W.P.add(r)}W.P.sign(17.4,2.25,['TELEPHONE'],{wall:1,y:1.75,w:.8,h:.25,bg:'#fff',fg:'#111'});player.visible=false;W.cam([9,2.4,4.6],[17.4,1.6,2.25])},
 q:{t:'pick',p:'There\'s a telephone in this limited-clearance area. When can you use it?',o:['Only in an emergency, if nothing else is available','For routine calls to the signaller','To phone home','Any time'],a:0},
 why:'A <b>yellow roundel</b> on the phone cabinet marks a limited-clearance telephone: <b>emergency use only</b>, when nothing else is available.'},
];

// ================= OTHER COMPETENCIES: shared helpers =================
const COMPINFO={
  pts:{n:'PTS',full:'Handbook 1 (Issue 9)',hb:'HB1 Iss 9'},
  coss:{n:'COSS',full:'Handbook 7 (Issue 10)',hb:'HB7 Iss 10'},
  iwa:{n:'IWA',full:'Handbook 6 (Issue 8)',hb:'HB6 Iss 8'},
  lo:{n:'Lookout / SW',full:'Handbook 3 (Issue 4)',hb:'HB3 Iss 4'},
  pc:{n:'PC / Blockages',full:'Handbook 8 (Issue 10)',hb:'HB8 Iss 10'},
  hs:{n:'Handsignaller',full:'Handbook 5 (Issue 3)',hb:'HB5 Iss 3'},
  es:{n:'ES',full:'Handbook 12 (Issue 11)',hb:'HB12 Iss 11'},
  mc:{n:'MC / OTP',full:'Handbook 15 (Issue 7)',hb:'HB15 Iss 7'},
  ac:{n:'AC lines',full:'Handbook 16 (Issue 7, June 2026)',hb:'HB16 Iss 7'},
  dc:{n:'DC lines',full:'Handbook 17 (Issue 6, June 2026)',hb:'HB17 Iss 6'},
};
const XSCENES=[];
function SC(c){return (id,t,rt,ref,o)=>XSCENES.push(Object.assign({c,id:c+'-'+id,t,rt,ref:COMPINFO[c].hb+' '+ref},o))}
const pk=(p,o,a=0,chat)=>({t:'pick',p,o,a,chat});
const mu=(p,o,a,chat)=>({t:'multi',p,o,a,chat});
const tp=(p,z,a,o={})=>Object.assign({t:'tap',p,z,a},o);
const sp=(p,a,labels,multi)=>({t:'spot',p,a,labels,multi});
// common set-ups
const ME=(role,x=-1,z=3.0,face=-Math.PI/2)=>W=>{W.role(role);W.me(x,z,face)};
function gang(W,role='coss',x=1){W.role(role);W.me(x-2.5,3.0);return W.group(3,x,0)}

const CRULES=COMP==='pts'?RULES:Object.fromEntries(CSCENES.map(s=>[s.id,s.rt]));
function pickList(){const ids=(QS.get('ids')||'').split(',').filter(Boolean);
  if(ids.length)return CSCENES.filter(s=>ids.includes(s.id)||s.r.some(r=>ids.includes(r)));
  const sec=QS.get('sec');if(sec)return CSCENES.filter(s=>s.sec===sec);return CSCENES.slice()}
async function playScene(sc){
  reset();stage(`${CINFO.n} · ${idx+1}/${list.length}`);
  W.cam([-6,3.6,10.5],[2,1,.5],.01);
  if(sc.set)sc.set(W);
  if(sc.play){banner(sc.t);await sc.play(W);banner('')}
  const q=sc.q;let r;
  if(q.t==='pick')r=await pickUI(sc,q);else if(q.t==='multi')r=await multiUI(sc,q);else if(q.t==='tap')r=await tapUI(sc,q);else if(q.t==='spot')r=await spotUI(sc,q);else if(q.t==='look')r=await lookUI(sc,q);
  r.ok?(S.good(),addScore(1)):(S.bad(),flash());
  if(q.t==='tap'&&q.walk&&r.ans){const z=q.z.find(z=>z.id===r.ans);await W.walk(player,z.x,z.z,3)}
  if(sc.after){$('sheet').classList.add('compact');await sc.after(W,r.ok,r.ans)}
  covSet(sc.r,r.ok);results.push({id:sc.id,ok:r.ok,r:sc.r,t:sc.t});
  await feedback(sc,r.ok);
}
async function run(){
  window.__ready=1;
  list=pickList();if(window.__only)list=CSCENES.filter(s=>window.__only.includes(s.id));
  W.cam([-6,3.6,10.5],[2,1,.5],.01);
  document.title=CINFO.n+' scenes · Track Ready';
  await info(CINFO.n.toUpperCase()+' · SCENE MODE',`<b>${list.length} scene${list.length>1?'s':''}.</b> Each one is a real moment on the job: watch, then make the call. Every scene proves a rule in ${CINFO.full}.<br><br><span style="opacity:.7">Sound on for horns and warnings. Signs and kit are simplified.</span>`,'Start');
  for(idx=0;idx<list.length;idx++)await playScene(list[idx]);
  reset();player.visible=true;W.cam([-5,3,8],[0,1.2,3]);
  const ok=results.filter(r=>r.ok).length,miss=results.filter(r=>!r.ok);
  const cov=covGet();const proven=Object.keys(CRULES).filter(k=>cov[k]&&cov[k].ok).length;
  sheet(`<h2>RESULTS</h2><div class="q">${ok} / ${results.length} right calls</div>
   <div class="body">${CINFO.n} rules proven so far: <b>${proven} / ${Object.keys(CRULES).length}</b></div>
   ${miss.length?`<div class="body"><b>Go over these again:</b><ul class="miss">${miss.map(m=>`<li>${m.r.map(r=>CRULES[r]).join('; ')}</li>`).join('')}</ul></div><a class="go" style="display:block;text-align:center;text-decoration:none" href="?c=${COMP}&ids=${miss.map(m=>m.id).join(',')}">Retry the ${miss.length} I missed</a>`:'<div class="body">Clean sheet. 👏</div>'}
   <a class="go" style="display:block;text-align:center;text-decoration:none;background:#2a3442;color:#fff;box-shadow:none" href="app.html">Back to Track Ready</a>`);
  window.__done=1;
}
window.__dbg={camP,camL,camera,W,P};

// ================= EXTRA KIT FOR ALL COMPETENCIES =================
const roleMeshes=[];
const ARM={coss:[0x2b5fd6,0xffffff,'COSS'],lo:[0xffffff,0xd02020,'LOOKOUT'],sw:[0xffffff,0x2b5fd6,'SITE WARDEN'],pc:[0xffffff,0x1f9d4a,'PC'],mc:[0xffffff,0x111111,'MC'],es:[0xf5d000,0x2b5fd6,'ES'],picop:[0xf5d000,0xd02020,'PICOP'],iwa:[0xff7a00,0x111111,'IWA'],hs:[0xff7a00,0x111111,'HANDSIGNALLER']};
function armlet(p,role){const a=ARM[role];const b=new THREE.Mesh(bx(.165,.13,.175),basic(a[0]));b.position.set(0,-.13,0);p.userData.arms[0].add(b);const st=new THREE.Mesh(bx(.168,.045,.178),basic(a[1]));st.position.set(0,-.13,0);p.userData.arms[0].add(st);return [b,st]}
W.role=(role,txt)=>{const ms=armlet(player,role);roleMeshes.push(...ms);youTag.visible=false;const a=ARM[role];const t=label(txt||('YOU · '+a[2]),'#'+a[0].toString(16).padStart(6,'0'),'#'+(a[0]===0xffffff||a[0]===0xf5d000?'111111':'ffffff'),Math.min(3.4,1.8+(txt||a[2]).length*.09));t.position.set(0,2.4,0);player.add(t)};
W.worker=(role,o={})=>{const a=ARM[role];const p=W.guy(Object.assign({tag:o.tag||a[2],tagBg:'#'+a[0].toString(16).padStart(6,'0'),tagFg:'#'+(a[0]===0xffffff||a[0]===0xf5d000?'111111':'ffffff')},o));armlet(p,role);return p};
W.group=(n=3,x=2,z=0,face=-Math.PI/2)=>{const g=[];for(let i=0;i<n;i++){const p=W.guy({x:x+i*1.3,z,face});p.userData.pose='kneel';g.push(p)}return g};
Object.assign(P,{
  conductor(x0=-150,x1=150,z=R1+.45,lab=true){const len=x1-x0;P.box(x0+len/2,.64,z,len,.12,.14,0xeceff2);P.add(new THREE.Mesh(bx(len,.02,.15),basic(0xffffff))).position.set(x0+len/2,.71,z);for(let x=x0;x<x1;x+=3)P.box(x,.5,z,.16,.16,.16,0xd8c27a);if(lab&&z>0){const l=label('CONDUCTOR RAIL','#fff','#c00',2.4);l.position.set(3,1.1,z);P.add(l)}return z},
  guard(x0,x1,z){const len=x1-x0;P.box(x0+len/2,.62,z,len,.22,.05,0x7a5a3a)},
  det(x,z){const d=new THREE.Mesh(bx(.14,.06,.1),lm(0xc23b22));d.position.set(x,.6,z);return P.add(d)},
  dets(x0,z,dir=1){for(let i=0;i<3;i++)P.det(x0+dir*i*20,z)},
  plb(x,z=0){const g=new THREE.Group();const p=new THREE.Mesh(bx(.06,1.1,.06),lm(0x333333));p.position.y=.55;g.add(p);const b=plate(['P','LIMIT'],{w:.55,h:.55,bg:'#d02020',fg:'#fff'});b.position.y=1.3;b.rotation.y=-Math.PI/2;g.add(b);g.position.set(x,.3,z);return P.add(g)},
  wsmb(x,z=0){const g=new THREE.Group();const p=new THREE.Mesh(bx(.06,1.2,.06),lm(0x333333));p.position.y=.6;g.add(p);const b=new THREE.Mesh(bx(.05,.5,.8),lm(0x222222));b.position.y=1.3;g.add(b);const ls=[];for(const dz of[-.22,.22]){const r=flameSprite(0xff2020,.5);r.position.set(-.08,1.3,dz);g.add(r);ls.push(r);const y=flameSprite(0xffc020,.5);y.position.set(.08,1.3,dz);g.add(y);ls.push(y)}anims.push(()=>{const on=Math.floor(T*2)%2===0;ls.forEach(l=>l.visible=on)});const t=label('WSMB','#111','#ffb020',1.2);t.position.y=2;g.add(t);g.position.set(x,.3,z);return P.add(g)},
  redflag(x,z=0){const g=new THREE.Group();const p=new THREE.Mesh(bx(.04,1,.04),lm(0x8a5a2b));p.position.y=.5;g.add(p);const f=new THREE.Mesh(bx(.02,.35,.5),basic(0xe02020));f.position.set(0,.85,.25);g.add(f);g.position.set(x,.3,z);anims.push(()=>{f.rotation.y=Math.sin(T*4)*.2});return P.add(g)},
  signal(x,z=2.0,asp='red'){P.box(x,2.1,z,.18,4.2,.18,0x222222);P.box(x,4.3,z,.5,1.2,.4,0x111111);const l=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),basic({red:0xff2020,green:0x57f287,yellow:0xffc020}[asp]));l.position.set(x-.22,4.5,z);P.add(l);const g=flameSprite({red:0xff2020,green:0x57f287,yellow:0xffc020}[asp],.9);g.position.set(x-.3,4.5,z);P.add(g)},
  otp(x,z=0,o={}){const g=new THREE.Group();const b=new THREE.Mesh(bx(5,1.6,2.3),lm(0xf5d000));b.position.y=1.5;g.add(b);const cab=new THREE.Mesh(bx(1.6,1.3,2.1),lm(0xf5d000));cab.position.set(-1.6,2.9,0);g.add(cab);const w=new THREE.Mesh(bx(.05,.8,1.8),lm(0x14171c));w.position.set(-2.42,2.95,0);g.add(w);
    for(const dx of[-1.7,1.7])for(const dz of[-1.05,1.05]){const t=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.4,14).rotateX(Math.PI/2),lm(0x222222));t.position.set(dx,.75,dz);g.add(t)}for(const dx of[-2.1,2.1])for(const dz of[-.72,.72]){const r=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.1,12).rotateX(Math.PI/2),lm(0x555555));r.position.set(dx,.55,dz);g.add(r)}
    if(o.boom){const bm=new THREE.Mesh(bx(4.5,.3,.3),lm(0xe0b000));bm.position.set(2.6,3.4,0);bm.rotation.z=.5;g.add(bm)}
    for(const s of[-.7,.7]){const hl=flameSprite(0xfff2c0,.5);hl.position.set(-2.6,1.4,s);g.add(hl)}const rl=flameSprite(0xff2020,.5);rl.position.set(2.6,1.4,0);g.add(rl);
    const t=label('OTP / RRV','#111','#ffb020',1.8);t.position.y=4.3;g.add(t);g.position.set(x,.3,z);return P.add(g)},
  tent(x,z){const m=new THREE.Mesh(new THREE.ConeGeometry(1.1,1.6,4),lm(0xff7a00));m.position.set(x,.8,z);m.rotation.y=Math.PI/4;return P.add(m)},
  ladder(x,z,up){const g=new THREE.Group();for(const s of[-.22,.22]){const r=new THREE.Mesh(bx(.05,4,.05),lm(0xc8c8c8));r.position.set(0,2,s);g.add(r)}for(let i=0;i<11;i++){const r=new THREE.Mesh(bx(.04,.04,.44),lm(0xc8c8c8));r.position.set(0,.2+i*.36,0);g.add(r)}g.position.set(x,.3,z);if(!up){g.rotation.z=Math.PI/2;g.position.y=1.2}return P.add(g)},
  bond(x,z=R1,col=0xd02020){const c=new THREE.Mesh(bx(.08,.08,1.4),basic(col));c.position.set(x,.5,z+.7);P.add(c);const l=label(col===0xd02020?'RED BOND':'BOND','#d02020','#fff',1.4);l.position.set(x,1.1,z+.9);return P.add(l)},
  sprs(x,z=2.6){P.box(x,.6,z,.1,1.2,.1,0x333333);P.box(x,1.3,z,.35,.45,.25,0xe0e0e0);const l=label('SPRS','#111','#fff',1);l.position.set(x,1.9,z);P.add(l)},
  edw(x,z=2.3){P.sign(x,z,['END OF','DEGRADED','WORKING'],{y:1.6,w:.9,h:.8,bg:'#fff',fg:'#111',border:'#111'})},
  structPlate(x,txt='LN1 / 45'){const pl=plate([txt],{w:.7,h:.3,bg:'#fff',fg:'#111',border:'#111'});pl.position.set(x-.2,2.4,2.3);pl.rotation.y=-Math.PI/2;P.add(pl)},
  bag(x,z,col=0xff7a00){const g=new THREE.Group();const b=new THREE.Mesh(bx(.7,.4,.35),lm(col));b.position.y=.2;g.add(b);g.position.set(x,.3,z);return P.add(g)},
  tcod(x,z=0){const b=new THREE.Mesh(bx(.25,.15,.2),lm(0xf5d000));b.position.set(x,.62,z-R1);P.add(b);const c=new THREE.Mesh(bx(.04,.04,1.45),basic(0x111111));c.position.set(x,.6,z);P.add(c);const l=label('T-COD','#111','#ffb020',1.2);l.position.set(x,1.2,z);P.add(l)},
  slw(x,z=2.6){P.sign(x,z,['SLW'],{y:1.4,w:.6,h:.4,bg:'#fff',fg:'#111',border:'#111'})},
});
// form cards
W.form=(code,title,lines=[])=>W.card(`<div class="form"><b>${code}</b><span>${title}</span>${lines.map(l=>`<i>${l}</i>`).join('')}</div>`);
W.chat=null;

// ---------- loop ----------
let last=performance.now(),T=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;T+=dt;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.dur);tw.fn(k);if(k>=1){tweens.splice(i,1);tw.res()}}
  for(const p of people){
    const u=p.userData;if(!u.legs)continue;
    if(u.pose==='walk'){u.walk+=dt*9;const s=Math.sin(u.walk);u.legs[0].rotation.x=s*.7;u.legs[1].rotation.x=-s*.7;u.arms[0].rotation.x=-s*.6;if(Math.abs(u.arms[1].rotation.x)<1.5)u.arms[1].rotation.x=s*.6;u.body.position.y=0}
    else if(u.pose==='kneel'){u.legs[0].rotation.x=-1.4;u.legs[1].rotation.x=.2;u.body.position.y=-.38;u.body.rotation.x=.35;u.hammer=Math.max(0,(u.hammer||0)-dt);u.arms[1].rotation.x=-.9-Math.sin(T*(u.hammer>0?30:6))*.4;u.arms[0].rotation.x=-.6}
    else if(u.pose==='lean'){u.body.rotation.x=.3;u.legs[0].rotation.x=0;u.legs[1].rotation.x=0}
    else{u.legs[0].rotation.x*=.8;u.legs[1].rotation.x*=.8;u.body.position.y=0;u.body.rotation.x=0;if(p!==player&&p!==mate&&p!==lookout&&p!==lo2){}}
  }
  ring.rotation.y+=dt;
  if(tickFn)tickFn(dt);for(const a of anims)a();
  for(const f of FX){if(!f.group.visible){f.parts.forEach(p=>f.group.remove(p));f.parts.length=0;continue}f.acc+=dt*f.rate;while(f.acc>1){f.acc--;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,depthWrite:false,opacity:f.dark?.8:.5}));s.position.set(f.x+(Math.random()-.5)*.6,f.y,f.z);s.userData.life=0;s.scale.setScalar(.6);f.group.add(s);f.parts.push(s)}for(let i=f.parts.length-1;i>=0;i--){const p=f.parts[i];p.userData.life+=dt;p.position.y+=dt*1.6;p.position.x+=dt*4;p.scale.setScalar(.6+p.userData.life*2.2);p.material.opacity=Math.max(0,(f.dark?.8:.5)*(1-p.userData.life/1.6));if(p.userData.life>1.6){f.group.remove(p);f.parts.splice(i,1)}}}
  shake=Math.max(0,shake-dt*.6);
  camera.position.set(camP.x+(Math.random()-.5)*shake,camP.y+(Math.random()-.5)*shake,camP.z);
  camera.lookAt(camL);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
run();
})();
